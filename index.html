<style>
:root{ --ink:#1c2333; --sub:#5c6a84; --line:#d9e0ec; --brand:#274156; --brand2:#3d6a8f; --bg:#f4f6fa; --ok:#1e9e62; --warn:#c47b12; --ng:#d33a2c; --card:#fff; }
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
header{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;font-weight:700}
header .sub{font-size:12px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:2px 0 10px}
.card h3{font-size:15px;margin:14px 0 6px}
.small{font-size:12.5px;color:var(--sub);line-height:1.6}
.btn{display:block;width:100%;background:var(--brand2);color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;margin:8px 0;cursor:pointer}
.btn:active{opacity:.85}
.btn.sub{background:#e8eef6;color:var(--brand);border:1px solid var(--line)}
.btn.ghost{background:#fff;color:var(--ng);border:1px solid var(--ng)}
.btn.sm{width:auto;display:inline-block;padding:8px 14px;font-size:14px;margin:4px 4px 4px 0}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
label.fl{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=date],input[type=password],textarea,select{width:100%;font-size:16px;padding:10px;border:1.6px solid var(--line);border-radius:9px;background:#fff;font-family:inherit}
textarea{min-height:110px;line-height:1.6;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.seg button{flex:1;min-width:64px;padding:10px 4px;border-radius:9px;border:1.6px solid var(--line);background:#fff;font-size:14.5px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.nav{margin:4px 0 8px}.nav button{background:none;border:none;color:var(--brand2);font-size:15px;cursor:pointer;padding:6px 2px}
.officer{display:flex;gap:12px;align-items:flex-start}
.officer .face{flex:0 0 118px}
.officer .balloon{flex:1;background:#eef4fb;border:1.5px solid var(--line);border-radius:12px;padding:12px;position:relative;font-size:16.5px;line-height:1.75;min-height:96px}
.officer .balloon:before{content:"";position:absolute;left:-9px;top:26px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.qmeta{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.fb{font-size:16px;font-weight:700;margin:8px 0}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)} .fb.warn{color:var(--warn)}
.tag{display:inline-block;background:#e8eef6;color:var(--brand);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 6px 4px 0}
.kata{background:#fbf7ec;border:1.5px dashed #d9b95c;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.8;margin:10px 0}
.kata b{color:#8a6d1a}
.ans2{display:grid;grid-template-columns:1fr;gap:10px}

.ansbox2{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.75;background:#fff;white-space:pre-wrap}
.ansbox2.model{background:#f2f8f3;border-color:#bfe0c9}
.ansbox2 h4{margin:0 0 6px;font-size:13px;color:var(--sub)}
.check li{margin:5px 0;line-height:1.6}
ul.check{padding-left:20px;margin:6px 0}
.rec{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.qitem{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.qitem .qt{font-size:15.5px;line-height:1.6}
.hidden{display:none}
.mic-on{background:var(--ng)!important;color:#fff!important;border-color:var(--ng)!important}
.prog{height:8px;background:#e8eef6;border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--brand2)}
details{margin:8px 0} summary{cursor:pointer;font-size:14.5px;color:var(--brand2);font-weight:700}

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; };
const todayStr=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid=()=> "id"+Date.now().toString(36)+Math.floor(Math.random()*9999);
/* ================= state ================= */
const LSKEY="mensetsu_v1";
function freshState(){ return {
  cfg:{ target:"高校受験", dest:"", gender:"female", mood:"standard", qcount:5 },
  ai:{ provider:"gemini", p:{
    gemini:{ key:"", model:"gemini-2.5-flash" },
    openai:{ key:"", model:"gpt-4o-mini" },
    claude:{ key:"", model:"claude-3-5-haiku-latest" },
    custom:{ base:"", key:"", model:"" },
    ollama:{ base:"http://localhost:11434", model:"llama3.1" } } },
  custom:[],   /* {id, target, text, model, points} */
  sets:[],     /* {id, name(dest), qids:[customQuestionIds]} */
  records:[]   /* {date, target, dest, mood, partial, answers:[{q, a, fq, fa}]} */
}; }
let S=freshState();
function load(){ try{ const raw=localStorage.getItem(LSKEY); if(raw){ const p=JSON.parse(raw); if(p&&p.cfg) S=Object.assign(freshState(), p); } }catch(e){ S=freshState(); } }
function save(){ try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){ /* 保存できない環境でも動作は続ける */ } }
function aiReady(){ const c=S.ai.p[S.ai.provider]; if(!c) return false;
  if(S.ai.provider==="ollama") return !!c.model;
  if(S.ai.provider==="custom") return !!(c.base&&c.model);
  return !!c.key; }
/* ================= AI providers (browser-only keys) ================= */
function apiErr(name, status){ return new Error(name+" API エラー ("+status+")"+(status===404?"：モデル名が使えない可能性があります。モデル欄を gemini-2.5-flash など、使えるモデル名に変えてお試しください。":"")); }
async function aiChat(prompt){
  const prov=S.ai.provider, c=S.ai.p[prov];
  const sys="あなたは面接練習のコーチです。日本語で、簡潔で具体的に答えてください。";
  if(prov==="gemini"){
    const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(c.model)+":generateContent?key="+encodeURIComponent(c.key);
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:sys+"\n\n"+prompt}]}]})});
    if(!r.ok) throw apiErr("Gemini", r.status);
    const j=await r.json(); return j.candidates[0].content.parts.map(p=>p.text||"").join("");
  }
  if(prov==="claude"){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:c.model,max_tokens:1200,system:sys,messages:[{role:"user",content:prompt}]})});
    if(!r.ok) throw apiErr("Claude", r.status);
    const j=await r.json(); return j.content.map(p=>p.text||"").join("");
  }
  if(prov==="ollama"){
    const base=(c.base||"http://localhost:11434").replace(/\/+$/,"");
    const r=await fetch(base+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:c.model,stream:false,messages:[{role:"system",content:sys},{role:"user",content:prompt}]})});
    if(!r.ok) throw apiErr("Ollama", r.status);
    const j=await r.json(); return (j.message&&j.message.content)||"";
  }
  /* openai / custom: OpenAI-compatible chat completions */
  const base = prov==="openai" ? "https://api.openai.com/v1" : (c.base||"").replace(/\/+$/,"");
  const headers={"Content-Type":"application/json"}; if(c.key) headers["Authorization"]="Bearer "+c.key;
  const r=await fetch(base+"/chat/completions",{method:"POST",headers,body:JSON.stringify({model:c.model,messages:[{role:"system",content:sys},{role:"user",content:prompt}]})});
  if(!r.ok) throw apiErr(prov==="openai"?"OpenAI":"カスタム", r.status);
  const j=await r.json(); return j.choices[0].message.content||"";
}

let voicePref = JSON.parse(sessionStorage.getItem("ms_voice")||"null");
function speak(text, gender, mood, onend){
  try{
    const synth=window.speechSynthesis; if(!synth){ onend&&onend(); return; }
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";
    const vs=synth.getVoices().filter(v=>v.lang&&v.lang.startsWith("ja"));
    if(vs.length){ const named=vs.find(v=> gender==="female" ? /Kyoko|Otoya.*fem|female|女性/i.test(v.name) : /Otoya|male|男性/i.test(v.name)); u.voice=named||vs[0]; }
    u.pitch = gender==="female" ? 1.12 : 0.82;
    u.rate = mood==="pressure" ? 1.06 : mood==="warm" ? 0.96 : 1.0;
    u.onend=()=>{ onend&&onend(); }; u.onerror=()=>{ onend&&onend(); };
    synth.speak(u);
  }catch(e){ onend&&onend(); }
}
let recog=null;
function startRecog(textarea, btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert("この端末・ブラウザでは音声入力に対応していません。テキスト入力をご利用ください。"); return; }
  if(recog){ try{recog.stop();}catch(e){} recog=null; btn.classList.remove("mic-on"); btn.textContent="🎤 音声入力"; return; }
  try{
    recog=new SR(); recog.lang="ja-JP"; recog.interimResults=true; recog.continuous=true;
    const base=textarea.value;
    recog.onresult=e=>{ let txt=""; for(const r of e.results) txt+=r[0].transcript; textarea.value=base+txt; };
    recog.onend=()=>{ recog=null; btn.classList.remove("mic-on"); btn.textContent="🎤 音声入力"; };
    recog.onerror=()=>{ recog=null; btn.classList.remove("mic-on"); btn.textContent="🎤 音声入力"; };
    recog.start(); btn.classList.add("mic-on"); btn.textContent="⏹ 停止する";
  }catch(e){ alert("音声入力を開始できませんでした。テキスト入力をご利用ください。"); }
}

let session=null;
function buildQuestions(){
  const c=S.cfg;
  const set=S.sets.find(s=>s.name===c.dest);
  const fromSet=[];
  if(set){ set.qids.forEach(id=>{ const q=S.custom.find(x=>x.id===id);
    if(q) fromSet.push({text:q.text, points:q.points||"", hint:"", model:q.model||"", custom:true}); }); }
  if(fromSet.length>=c.qcount) return fromSet.slice(0,c.qcount);
  const bank=shuffle((BANK[c.target]||[]).map(q=>({text:q.q, points:q.p, hint:q.h, model:"", custom:false})));
  const list=[...fromSet];
  for(const b of bank){ if(list.length>=c.qcount) break; if(!list.some(x=>x.text===b.text)) list.push(b); }
  return list;
}
function startInterview(){
  const list=buildQuestions();

  area.innerHTML=`<div class="kata"><b>答え方の型：</b>${TYPE_LINE}<br>${q.hint?`<b>この質問のヒント：</b>${esc(q.hint)}<br>`:""}${q.points?`<b>面接官はここを見ている：</b>${esc(q.points)}`:""}</div>`;
}
let submitting=false;
async function submitAnswer(){
  if(submitting) return;
  const txt=$("#ansText").value.trim();
  if(!txt){ alert("答えを入力してください（音声入力でもOKです）。"); return; }
  const c=S.cfg, q=session.list[session.idx];
  if(recog){ try{recog.stop();}catch(e){} recog=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  if(session.phase==="main"){
    session.answers.push({q:q.text, a:txt, points:q.points||"", hint:q.hint||"", model:q.model||"", fq:"", fa:""});
    /* deep-dive follow-up (AI mode, once per question) */
    if(aiReady()){
      submitting=true;
      $("#officerFace").innerHTML=officerSVG(c.gender,"thinking");
      $("#flowNote").textContent="面接官が深掘り質問を考えています…";
      $("#submitBtn").disabled=true;
      try{
        const moodInst= c.mood==="pressure" ? "やや厳しめに、核心を突く" : c.mood==="warm" ? "やさしく、答えを引き出す" : "標準的な";
        const out=await aiChat(`対象：${c.target}／志望先：${c.dest||"未設定"} の面接です。質問「${q.text}」への回答「${txt}」に対して、${moodInst}深掘り質問を1つだけ作ってください。質問文のみを1行で返してください。`);
        const f=out.split("\n").map(x=>x.trim()).filter(Boolean)[0];
        if(f){ session.phase="follow"; session.followText=f; submitting=false; renderPractice(false); return; }
      }catch(e){ $("#flowNote").textContent="深掘り質問は生成できませんでした（そのまま次へ進みます）。"; }
      submitting=false;
    }
    nextQuestion();
  } else {
    const rec=session.answers[session.answers.length-1];
    rec.fq=session.followText||""; rec.fa=txt;
    session.phase="main"; session.followText="";
    nextQuestion();
  }
}
function nextQuestion(){
  const c=S.cfg;
  $("#officerFace").innerHTML=officerSVG(c.gender,"nod");
  session.idx++;
  if(session.idx>=session.list.length){ finishSession(false); return; }
  setTimeout(()=>renderPractice(false), 450);
}
function exitInterview(){
  if(!session) return;
  if(!confirm("面接を途中で退出しますか？ここまでの回答でフィードバックを出します。")) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  finishSession(true);
}
/* ================= feedback ================= */
function checkAnswer(rec){
  const a=rec.a||""; const n=a.length; const checks=[];
  const hasNum=/\d/.test(a), hasExample=/例えば|経験|参加|取り組|頑張|活動|大会|練習/.test(a),
        hasReason=/理由|なぜなら|だから|そのため|きっかけ/.test(a),
        polite=/です|ます/.test(a),
        hasClose=/たいです|ていきます|頑張り|目指し|生かし|学びたい|挑戦/.test(a);
  checks.push({ok:n>=60, txt: n<40? `文字数が少なめ（${n}字）。1つの答えは60〜150字が目安です。` : n<=220? `文字数は適切です（${n}字）。` : `少し長めです（${n}字）。要点を絞ると伝わりやすくなります。`});
  checks.push({ok:hasExample||hasNum, txt: hasExample||hasNum? "具体例や数字が入っていて、説得力があります。" : "具体例（経験・数字・場面）が入ると、ぐっと説得力が増します。"});
  checks.push({ok:hasReason, txt: hasReason? "理由やきっかけが述べられています。" : "「理由は〜」「きっかけは〜」と、理由をひと言添えましょう。"});
  checks.push({ok:polite, txt: polite? "丁寧な言葉遣いで答えられています。" : "「です・ます」調で締めると、面接らしい丁寧さになります。"});
  checks.push({ok:hasClose, txt: hasClose? "締め（意欲・目標）まで言えています。" : "最後に「〜したいです」と意欲や目標で締めると印象が残ります。"});
  const score=checks.filter(x=>x.ok).length;
  return {checks, score};
}
function finishSession(partial){
  const c=S.cfg;
  S.records.push({date:todayStr(), target:c.target, dest:c.dest, mood:c.mood, partial, answers:session.answers});
  save();
  const recs=session.answers.map(rec=>({rec, chk:checkAnswer(rec)}));
  const tot=recs.reduce((s,x)=>s+x.chk.score,0), max=recs.length*5||1;
  const level= tot/max>=0.8? "よく健闘" : tot/max>=0.55? "まずまず" : "伸びしろ大";
  const weak=[];
  if(recs.some(x=>!x.chk.checks[1].ok)) weak.push("具体例を足す");
  if(recs.some(x=>!x.chk.checks[2].ok)) weak.push("理由・きっかけを添える");
  if(recs.some(x=>!x.chk.checks[4].ok)) weak.push("締めの意欲まで言う");
  session=null; view="feedback";
  $("#app").innerHTML=`
   <div class="card">
    <h2>📋 フィードバック${partial?"（途中退出）":""}</h2>
    <p class="small">${esc(c.target)}／${esc(c.dest||"志望先未設定")}・${recs.length}問に回答・自己チェック総合：<b>${level}</b>（${tot}/${max}）</p>
    <h3>① 内容の具体性と熱意</h3>
    <p>${recs.map((x,i)=>`問${i+1}：${x.chk.checks[1].ok?"具体例あり":"具体例が薄め"}・${x.chk.checks[4].ok?"締めまで言えた":"締めが弱い"}`).join("／")||"—"}</p>
    <h3>② 受け答えの適切さ</h3>
    <p>${recs.map((x,i)=>`問${i+1}：${x.chk.checks[3].ok?"丁寧な言葉遣い":"言葉遣いに注意"}・${x.chk.checks[0].ok?"長さ適切":"長さに注意"}`).join("／")||"—"}</p>
    <h3>③ 改善へのアドバイス</h3>
    <p>${weak.length? "次は特に「"+weak.join("」「")+"」を意識してみましょう。" : "型が身についています。この調子で本番に臨みましょう。"}</p>
    <div class="kata"><b>修正文案の型：</b>結論「（質問への答えを一文で）」→ 理由「理由は〜です。きっかけは〜」→ 具体例「例えば、〜した経験があります」→ 締め「入学（入社）後は〜したいです」</div>
    ${aiReady()?`<button class="btn" id="aiFbBtn" onclick="aiFeedback(this)">🤖 AIに詳しいフィードバックをもらう</button><div id="aiFbArea"></div>`:`<p class="small">AIキーを設定すると、深掘り質問に加えて、回答ごとの詳しいフィードバックと修正文案がもらえます。</p>`}
   </div>
   ${recs.map((x,i)=>`
   <div class="card">
    <h3>問${i+1}：${esc(x.rec.q)}</h3>
    ${x.rec.fq?`<p class="small">深掘り：${esc(x.rec.fq)}</p>`:""}
    <ul class="check">${x.chk.checks.map(ch=>`<li>${ch.ok?"✅":"🔸"} ${esc(ch.txt)}</li>`).join("")}</ul>
    <div class="ans2">
      <div class="ansbox2"><h4>あなたの回答</h4>${esc(x.rec.a)}${x.rec.fa?`\n（深掘りへの回答）${esc(x.rec.fa)}`:""}</div>
      ${x.rec.model?`<div class="ansbox2 model"><h4>模範回答</h4>${esc(x.rec.model)}</div>`
        : `<div class="ansbox2"><h4>答え方の型・ポイント</h4>${TYPE_LINE}${x.rec.hint?`\nヒント：${esc(x.rec.hint)}`:""}${x.rec.points?`\n👀 ${esc(x.rec.points)}`:""}</div>`}
    </div>
   </div>`).join("")}
   <button class="btn sub" onclick="renderHome()">ホームへ戻る</button>`;
  window.scrollTo(0,0); }
async function aiFeedback(btn){
  const r=S.records[S.records.length-1]; if(!r) return;
  btn.disabled=true; btn.textContent="生成中…";
  const area=$("#aiFbArea");
  try{
    const qa=r.answers.map((x,i)=>`問${i+1}：${x.q}\n回答：${x.a}${x.fq?`\n深掘り：${x.fq}\n深掘りへの回答：${x.fa}`:""}`).join("\n\n");
    const out=await aiChat(`対象：${r.target}／志望先：${r.dest||"未設定"} の面接練習の記録です。次の3つの観点でフィードバックしてください。①内容の具体性と熱意 ②受け答えの適切さ ③改善へのアドバイス（いちばん弱い回答1つについて、書き直した修正文案も示す）。\n\n${qa}`);
    area.innerHTML=`<div class="ansbox2 model" style="margin-top:10px"><h4>🤖 AIフィードバック</h4>${esc(out)}</div>`;
    btn.textContent="🤖 AIフィードバック取得済み";
  }catch(e){ area.innerHTML=`<p class="small">取得できませんでした：${esc(e.message)}</p>`; btn.disabled=false; btn.textContent="🤖 AIに詳しいフィードバックをもらう"; }
}
/* ================= boot ================= */
try{ load(); renderHome(); window.__msBooted=true; }
catch(e){ const el=document.getElementById("app");
  if(el) el.innerHTML='<div class="card"><h2>アプリを起動できませんでした</h2><p>この表示環境では、スクリプトや保存機能（localStorage）が制限されている可能性があります。</p><p>Safari や Chrome でファイルを開くか、公開ページのURLから開いてみてください。</p><p class="small">詳細: '+String(e&&e.message||e)+'</p></div>'; }
window.__aiChat=aiChat; window.__state=()=>S; window.__bank=BANK;
</script>
</body>
</html>
